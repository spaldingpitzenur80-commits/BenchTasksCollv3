name: Assemble finalpool

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch all branches
        run: git fetch origin '+refs/heads/*:refs/remotes/origin/*'
      - name: Assemble implemented tasks
        run: python3 assemble_finalpool.py
      - name: Commit and push finalpool
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tasks/finalpool
          git commit -m "Assemble implemented tasks into tasks/finalpool"
          git push origin HEAD:finalpool
